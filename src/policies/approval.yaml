# Approval gate rules.
#
# An approval binds to one proposed action. It is not a session token, a role, or
# a "user said fine earlier". The server validates these rules in approval_gate
# before any A2 result is returned to a caller.
#
# Source: SRD v1.0 §panel-architecture (interaction
# contract) and #panel-governance (separation of duties).

schema: enterprise-business-plugin/policy/approval/v1
id: approval

rules:
  action_specific:
    statement: An approval authorises exactly one proposed action.
    enforced: approval must carry the action digest it was granted for
  expiry:
    statement: An approval expires when its context changes or its window passes.
    default_window_minutes: 60
    invalidates_on:
      - any change to the proposed action payload
      - scope expansion
      - approver role loss
      - policy version change
  no_reuse:
    statement: An approved action cannot be re-executed under the same approval.
    enforced: approval id is single-use; replay is rejected
  separation_of_duties:
    statement: The approver is not the proposer and not the model.
    enforced: approver identity must differ from the requesting actor
  authorised_approver:
    statement: >-
      The approver is the accountable owner of the skill's function, or holds a role this
      deployment has delegated authority to for the contract's risk tier. A role that
      merely exists is not authority.
    enforced: >-
      the approver's role must either match the contract's declared owner (authority the
      source document already assigns, so it needs no configuration) or appear in
      roles_by_risk for the contract's risk tier. Anything else denies. An empty tier list
      is not a hole: it only means the owner is the sole approver, which is the narrowest
      default. Populate the tier when the owner delegates.
    roles_by_risk:
      Low: []
      Moderate: []
      High: []
      Critical: []
  evidence_bundle:
    statement: The approver sees what they are approving.
    required_fields:
      - proposed_action
      - skill_id_and_version
      - cited_evidence
      - risk_tier
      - reversibility
      - rollback_path
  refusal_default:
    statement: Missing or malformed approval denies; it never degrades to allow.
