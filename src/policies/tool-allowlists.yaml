# Tool allowlists — what a skill may call, and where enforcement has to live.
#
# The categories for each skill are derived from its contract and regenerated by
# tools/build.py into src/registry/tool-allowlists.yaml. The operation classes are
# a function of the skill's *effective* autonomy, below.
#
# READ THIS BEFORE ASSUMING IT IS ENFORCED:
#
#   This package does not route tool calls. It cannot stop a client from calling a
#   tool it never sees. What it provides is the decision (check_tool_call) and the
#   derived allowlist (tool_allowlist); the gateway or client that fronts your
#   connectors has to apply them before dispatch.
#
#   A skill's prose is not an enforcement point. Neither is this file on its own.

schema: enterprise-business-plugin/policy/tool-allowlists/v1
id: tool-allowlists

default_decision: deny

# Operation classes a skill may use at a given effective autonomy level. A1 drafts
# in the conversation and does not write into a system of record — so `propose`,
# which creates a record, is not available until A2.
operations_by_autonomy:
  A0: [read]
  A1: [read]
  A2: [read, propose, write]
  A3: [read, propose, write]

deny_when:
  - the operation is not permitted at the skill's effective autonomy level
  - the tool's system category is not declared by the skill's contract
  - the tool is absent from the connector manifest
  - the connector failed check_connector (decision is not `ready`)

# Always refused, regardless of skill, connector or approval.
never_permitted:
  - operation: write
    unless: effective autonomy is A2 or higher AND the connector's write tool declares rollback
  - category: any category the contract does not declare
  - tool: any tool not declared in the connector manifest
  - condition: connector rejected by check_connector

# Boundary with the autonomy layer, because the two are easy to confuse:
#   route_autonomy answers "may this capability write at all?"
#   check_tool_call answers "may this capability reach this specific tool?"
# Both must allow before a write is legitimate. Neither is sufficient alone.

enforcement_contract:
  decision_function: check_tool_call(skill_id, tool_name, operation, category, connector_status)
  abstract_rule: tool_allowlist(skill_id)
  caller_must:
    - resolve the skill and its effective autonomy before dispatch
    - look up the tool's declared operation and category from the connector manifest
    - deny on any non-allow decision, and log the denial with the correlation id
    - refuse to dispatch when the connector decision is not `ready`
  caller_must_not:
    - widen the allowlist at the prompt level
    - pass a category the connector manifest does not declare
    - treat a missing tool declaration as "probably fine"
