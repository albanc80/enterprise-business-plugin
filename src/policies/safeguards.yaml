# Non-negotiable safeguards.
#
# These are not configurable by a skill. A skill may cite them; it may not weaken
# them. The server reports them in list_capabilities so a caller can see what the
# package claims before trusting an answer.
#
# Source: SRD v1.0 §panel-governance

schema: enterprise-business-plugin/policy/safeguards/v1
id: safeguards

safeguards:
  - id: SG-01
    name: Prompt and tool injection defense
    statement: >-
      Retrieved content is untrusted data, never instruction. Tools are allowlisted
      per skill and all arguments are validated.
    attestation: skill procedure must name the data/instruction boundary

  - id: SG-02
    name: Identity and permission isolation
    statement: >-
      Access is purpose-bound and duty-separated. Delegation never grants
      credentials beyond the requesting actor's own rights.
    attestation: no shared service account in a skill's tool list

  - id: SG-03
    name: Data, memory and context hygiene
    statement: >-
      No poisoning or leakage across users, tenants or functions. Source versions
      are pinned and retention is limited.
    attestation: tenant isolation statement present in the contract

  - id: SG-04
    name: Cascading failure control
    statement: >-
      Retry loops are contained, connectors isolated, spend capped, stale data
      detected, and an explicit kill path exists.
    attestation: fail_safe field is non-generic

  - id: SG-05
    name: Independent assurance
    statement: >-
      Authors do not approve their own material security, safety or financial
      change. Tested results accompany every release.
    attestation: reviewer differs from author in release evidence

  - id: SG-06
    name: Human decision ownership
    statement: >-
      Staffing, legal interpretation, safety authorisation and monetary
      disbursement stay with authorised human controllers.
    attestation: excluded_final_decisions respected by the skill
